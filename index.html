<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Responsive Card</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .card p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <main class="card">
    <h2>Clean Starter Template</h2>
    <p>A mobile-ready, accessible HTML5 layout styled with modern CSS variables and a dark palette.</p>
    <a href="#" class="btn">Get Started</a>
  </main>

</body>
</html>
