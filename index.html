<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <!-- मोबाइल स्क्रीन पर सही फिट होने के लिए viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Responsive Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* min-height: 100dvh से मोबाइल ब्राउज़र के बार कटते नहीं हैं */
      min-height: 100dvh;
      display: flex;
      justify-content: center; /* आड़ा बीच में (Horizontally Center) */
      align-items: center;     /* खड़ा बीच में (Vertically Center) */
      background: #1e293b;     /* बैकग्राउंड डार्क कलर */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .card {
      background: #334155;
      color: #ffffff;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fde047; /* हेडिंग का हल्का पीला रंग */
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .card p {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      background-color: #2dd4bf;
      color: #0f172a;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #14b8a6;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Clean Starter Template</h1>
    <p>A mobile-ready, accessible HTML5 layout styled with modern CSS variables and a dark palette.</p>
    <button class="btn">Get Started</button>
  </div>

</body>
</html>
